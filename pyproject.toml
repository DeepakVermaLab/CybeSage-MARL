[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybsage-marl"
version = "0.1.0"
description = "Self-supervised context-aware MARL pipeline for adaptive cyber defense"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "networkx>=3.1",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "nbformat>=5.9",
]
cage4 = [
  "gym==0.26.2",
  "gymnasium==0.28.1",
  "pettingzoo==1.24.3",
  "ray[rllib]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
